name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AutomatiskSportTV.sln

      - name: Build solution (Release)
        run: dotnet build AutomatiskSportTV.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/AutomatiskSportTV.Core.Tests/AutomatiskSportTV.Core.Tests.csproj -c Release --no-build --verbosity normal
